name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    checks:
        name: Lint, typecheck, test, build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
            NEXT_PUBLIC_APP_URL: http://localhost:3000
            CLOUDINARY_CLOUD_NAME: ci-placeholder
            AUTH_URL: http://localhost:3000
            AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
            NEXT_TELEMETRY_DISABLED: "1"

        steps:
            - name: Check out the code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate the Prisma client
              run: npx prisma generate

            - name: Lint
              run: npm run lint

            - name: Generate Next's type files
              run: npx next typegen

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Unit tests
              run: npm test

            - name: Unit tests, in another time zone
              run: npm test
              env:
                  TZ: Asia/Tokyo

            - name: Production build
              run: npx next build
